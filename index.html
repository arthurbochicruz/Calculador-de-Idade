<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculador de Idade</title>
    <style>
        @charset "UTF-8";

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f4f5f7;
    color: #202124;
}

.container {
    width: 100%;
    padding: 20px;
}

.calculadora {
    width: 100%;
    max-width: 450px;
    margin: auto;
    padding: 35px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
}

h1 {
    margin-bottom: 12px;
    font-size: 30px;
    text-align: center;
}

.descricao {
    margin-bottom: 30px;
    color: #666;
    line-height: 1.5;
    text-align: center;
}

.campo {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 20px;
}

.campo label {
    font-size: 15px;
    font-weight: bold;
}

.campo input {
    width: 100%;
    padding: 13px 15px;
    border: 1px solid #d0d0d0;
    border-radius: 8px;
    outline: none;
    font-size: 16px;
    transition: 0.2s;
}

.campo input:focus {
    border-color: #4f46e5;
}

button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #4f46e5;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #4338ca;
}

.resultado {
    margin-top: 25px;
    padding: 20px;
    border-radius: 10px;
    background: #f1f3f5;
    text-align: center;
}

.resultado p {
    margin-bottom: 8px;
    color: #666;
}

.resultado strong {
    font-size: 22px;
}

@media (max-width: 500px) {
    .calculadora {
        padding: 25px;
    }

    h1 {
        font-size: 26px;
    }
}
    </style>
</head>
<body>

    <main class="container">
        <section class="calculadora">
            <h1>Calculador de Idade</h1>

            <p class="descricao">
                Digite sua data de nascimento para descobrir sua idade exata.
            </p>

            <div class="campo">
                <label for="data-nascimento">Data de nascimento</label>
                <input type="text" id="data-nascimento" placeholder="Selecione sua data, Dia / Mês / Ano.">
            </div>

            <button id="calcular">Calcular idade</button>

            <div id="resultado" class="resultado">
                <p>Sua idade é:</p>
                <strong id="idade">0 anos, 0 meses e 0 dias.</strong>
            </div>
        </section>
    </main>
    <script>
        const dataAtual = new Date();

        const diaAtual = dataAtual.getDate();
        const mesAtual = dataAtual.getMonth() + 1;
        const anoAtual = dataAtual.getFullYear();
   
        document.getElementById('calcular').addEventListener('click', () => {
            
            const dataNascimento = document.getElementById('data-nascimento').value

            if (!dataNascimento.includes("/")) {
                alert(" Digite a data no formato DD / MM / AAAA ");
                return;

            }
                    const [ dia, mes, ano ] = dataNascimento.split("/");
                    const diasNoMes = new Date(ano, mes, 0).getDate();
                    if (isNaN(dia)) {
                        alert("O dia precisa ser um número.");
                        return;
                    }
                    if (isNaN(mes)) {
                        alert("O mês precisa ser um número.");
                        return;
                    }
                    if (isNaN(ano)) {
                        alert("O ano precisa ser um número.");
                        return;
                    }

                    if (dia < 1) {alert('Não existe este dia, digite corretamente.'); return}                       
                    if (mes < 1) {alert('Não existe este mês, digite corretamente.'); return}    
                    if (ano < 1) {alert('Não existe este ano, digite corretamente.'); return}
                    if (dia > 31) {
                        alert('Digite os dias corretamente.')
                        return

                    } if (mes > 12) {
                        alert('Digite os meses corretamente.')
                        return

                    } if (ano > anoAtual) {
                        alert('Este ano não chegou.')
                        return

                    } if (dia > diasNoMes) {
                        alert("Essa data não existe!");
                        return;

                    } 
                        
                        let diaNascimento = diaAtual - dia
                        let mesNascimento = mesAtual - mes 
                        let anoNascimento = anoAtual - ano 

                        if (mesNascimento < 0) {
                            anoNascimento--;
                            mesNascimento += 12;

                        } if (diaNascimento < 0) {
                            
                            mesNascimento--;
                            const diasNoMesAnterior = new Date(anoAtual, mesAtual - 1, 0).getDate();
                            diaNascimento += diasNoMesAnterior;
                        }
                                const resultado = document.getElementById('idade')
                                resultado.textContent = `${anoNascimento} anos, ${mesNascimento} meses e ${diaNascimento} dias.`
                            }
        )
    </script>
</body>
</html>
